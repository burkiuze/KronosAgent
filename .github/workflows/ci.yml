name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test (no provider, then the demo model chosen explicitly)
        run: |
          node packages/cli/dist/bin.js version
          # no provider connected: refuses with a "connect a provider" message instead of a demo answer
          if node packages/cli/dist/bin.js run "hello" > out.txt 2>&1; then cat out.txt; exit 1; fi
          grep -q "No model provider is connected" out.txt
          node packages/cli/dist/bin.js run "list the files here" --mode yolo --model demo
          node packages/cli/dist/bin.js doctor || true

  e2e:
    name: web UI end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SCREENSHOTS: e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  desktop:
    name: desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck -w @kronos/desktop
      - run: npm run build:desktop

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kronos-agent:ci .
      - name: Gateway answers in the container
        run: |
          docker run -d --name kronos -p 7777:7777 -e KRONOS_GATEWAY_TOKEN=ci kronos-agent:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7777/api/health && break; sleep 1; done
          curl -fsS -H 'authorization: Bearer ci' http://127.0.0.1:7777/api/status
          docker logs kronos
