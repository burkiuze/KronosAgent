event emitter once:
  src/emitter.js: |
    export class Emitter {
      #handlers = new Map();

      on(event, fn) {
        const list = this.#handlers.get(event) ?? [];
        list.push(fn);
        this.#handlers.set(event, list);
        return () => this.off(event, fn);
      }

      off(event, fn) {
        const list = this.#handlers.get(event) ?? [];
        this.#handlers.set(event, list.filter((f) => f !== fn));
      }

      once(event, fn) {
        const wrapper = (...args) => {
          this.off(event, wrapper);
          fn(...args);
        };
        return this.on(event, wrapper);
      }

      emit(event, ...args) {
        for (const fn of [...(this.#handlers.get(event) ?? [])]) fn(...args);
      }
    }
feature across layers:
  src/model.js: |
    let next = 1;

    export const PRIORITIES = ['high', 'normal', 'low'];

    export function createTodo(title, priority = 'normal') {
      if (!title?.trim()) throw new Error('title required');
      if (!PRIORITIES.includes(priority)) throw new Error(`invalid priority: ${priority}`);
      return { id: next++, title: title.trim(), done: false, priority, createdAt: Date.now() + next };
    }
  src/store.js: |
    import { readFileSync, writeFileSync, existsSync } from 'node:fs';

    export function load(file) {
      if (!existsSync(file)) return [];
      return JSON.parse(readFileSync(file, 'utf8')).map((t) => ({ id: t.id, title: t.title, done: t.done, priority: t.priority ?? 'normal', createdAt: t.createdAt }));
    }

    export function save(file, todos) {
      writeFileSync(file, JSON.stringify(todos.map((t) => ({ id: t.id, title: t.title, done: t.done, priority: t.priority, createdAt: t.createdAt }))));
    }
  src/todos.js: |
    import { createTodo, PRIORITIES } from './model.js';

    export class Todos {
      constructor(items = []) {
        this.items = items;
      }

      add(title, priority) {
        const t = createTodo(title, priority);
        this.items.push(t);
        return t;
      }

      list() {
        const rank = (t) => PRIORITIES.indexOf(t.priority ?? 'normal');
        return [...this.items].sort((a, b) => rank(a) - rank(b) || a.createdAt - b.createdAt);
      }
    }
