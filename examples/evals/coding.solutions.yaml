implement to spec:
  src/semver.js: |
    function parse(v) {
      const [core, pre] = v.replace(/^v/, '').split(/-(.*)/s);
      return { nums: core.split('.').map(Number), pre: pre ? pre.split('.') : [] };
    }

    function comparePart(x, y) {
      const nx = /^\d+$/.test(x);
      const ny = /^\d+$/.test(y);
      if (nx && ny) return Math.sign(Number(x) - Number(y));
      if (nx) return -1;
      if (ny) return 1;
      return x < y ? -1 : x > y ? 1 : 0;
    }

    export function compare(a, b) {
      const A = parse(a);
      const B = parse(b);
      for (let i = 0; i < 3; i++) if (A.nums[i] !== B.nums[i]) return Math.sign(A.nums[i] - B.nums[i]);
      if (!A.pre.length || !B.pre.length) return A.pre.length ? -1 : B.pre.length ? 1 : 0;
      for (let i = 0; i < Math.max(A.pre.length, B.pre.length); i++) {
        if (A.pre[i] === undefined) return -1;
        if (B.pre[i] === undefined) return 1;
        const c = comparePart(A.pre[i], B.pre[i]);
        if (c) return c;
      }
      return 0;
    }
