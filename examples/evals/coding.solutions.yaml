python feature with tests:
  report.py: |
    import csv
    import io


    class Report:
        def __init__(self, columns, rows):
            self.columns = columns
            self.rows = rows  # list of dicts

        def total(self, column):
            return sum(r[column] for r in self.rows)

        def to_csv(self):
            buf = io.StringIO()
            w = csv.writer(buf, lineterminator='\n')
            w.writerow(self.columns)
            for r in self.rows:
                w.writerow([r.get(c, '') for c in self.columns])
            return buf.getvalue()
  test_report.py: |
    import unittest
    from report import Report


    class ReportTest(unittest.TestCase):
        def test_total(self):
            self.assertEqual(Report(['n'], [{'n': 1}, {'n': 2}]).total('n'), 3)

        def test_to_csv(self):
            self.assertEqual(Report(['a'], [{'a': 'x,y'}]).to_csv(), 'a\n"x,y"\n')


    if __name__ == '__main__':
        unittest.main()
