path traversal:
  src/static.js: |
    import { resolve, sep } from 'node:path';

    /** Maps a URL path to a file inside root, or null when it is not allowed. */
    export function resolveSafe(root, urlPath) {
      let decoded;
      try {
        decoded = decodeURIComponent(urlPath);
      } catch {
        return null;
      }
      const base = resolve(root);
      const full = resolve(base, '.' + sep + decoded);
      return full.startsWith(base + sep) ? full : null;
    }
config migration:
  src/migrate.js: |
    const KNOWN = new Set(['version', 'host', 'port', 'user', 'ssl', 'pool']);

    export function migrate(config) {
      if (config.version === 2) return config;
      if (config.version !== 1) throw new Error(`unsupported config version: ${config.version}`);
      const port = config.port === undefined ? 5432 : Number(config.port);
      const ssl = ['yes', 'true', '1', true].includes(config.ssl);
      const out = { version: 2, database: { url: `postgres://${config.user}@${config.host}:${port}`, ssl }, pool: { max: config.pool ?? 5 } };
      const legacy = Object.fromEntries(Object.entries(config).filter(([k]) => !KNOWN.has(k)));
      if (Object.keys(legacy).length) out.legacy = legacy;
      return out;
    }
