parse durations:
  src/duration.js: |
    const UNITS = { d: 86400, h: 3600, m: 60, s: 1 };

    /** "1h30m", "45s", "1d 2h" → seconds */
    export function parseDuration(text) {
      const s = String(text).trim();
      if (!/^(\d+[dhms]\s*)+$/.test(s)) throw new Error(`invalid duration: ${text}`);
      let total = 0;
      for (const [, n, u] of s.matchAll(/(\d+)([dhms])/g)) total += Number(n) * UNITS[u];
      return total;
    }
